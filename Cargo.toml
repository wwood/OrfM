[package]
name = "orfm"
version = "2.0.2"
edition = "2021"
description = "A pure-Rust port of OrfM - a simple and not slow open reading frame (ORF) caller"
license = "LGPL-3.0"
repository = "https://github.com/wwood/OrfM"
homepage = "https://github.com/wwood/OrfM"

[lib]
name = "orfm"
path = "src/lib.rs"

[[bin]]
name = "orfm"
path = "src/main.rs"

[dependencies]
aho-corasick = "1"
needletail = "0.6"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
