[package]
name = "orfm"
version = "2.1.1"
edition = "2021"
description = "A pure-Rust port of OrfM - a simple and not slow open reading frame (ORF) caller"
license = "LGPL-3.0"
repository = "https://github.com/wwood/OrfM"
homepage = "https://github.com/wwood/OrfM"

[lib]
name = "orfm"
path = "src/lib.rs"

[[bin]]
name = "orfm"
path = "src/main.rs"

[dependencies]
aho-corasick = "1"
needletail = { version = "0.7", default-features = false, features = ["compression"] }
fastq = "0.6"
clap = { version = "4", features = ["derive"] }
# Force zlib-ng backend for all flate2 users (needletail, fastq crate).
# needletail's default enables flate2/rust_backend (miniz_oxide); we disable
# that and let flate2 use only zlib-ng via this direct dependency.
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }

[dev-dependencies]
assert_cli = "0.6"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
